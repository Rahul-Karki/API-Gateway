apiVersion: v1
kind: Service
metadata:
  name: grafana-agent
  labels:
    app: grafana-agent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: loki-push
      port: 3100
      targetPort: 3100
      protocol: TCP
  selector:
    app: grafana-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-agent
  template:
    metadata:
      labels:
        app: grafana-agent
    spec:
      containers:
        - name: grafana-agent
          image: grafana/agent:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: loki-push
              containerPort: 3100
          env:
            - name: GRAFANA_CLOUD_USER_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: user-id
            - name: GRAFANA_CLOUD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: api-token
            - name: BACKEND_URL
              value: "your-backend.onrender.com"
            - name: GATEWAY_URL
              value: "your-gateway.onrender.com"
          volumeMounts:
            - name: config
              mountPath: /etc/grafana-agent.yaml
              subPath: grafana-agent.yaml
            - name: positions
              mountPath: /tmp/grafana-agent-positions
          livenessProbe:
            httpGet:
              path: /api/v1/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: grafana-agent-config
        - name: positions
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-agent-config
data:
  grafana-agent.yaml: |
    server:
      log_level: info
      http_listen_addr: 0.0.0.0
      http_listen_port: 8080

    metricsConfig:
      scrape_configs:
        - job_name: 'backend'
          static_configs:
            - targets: ['${BACKEND_URL}:9090']
          scheme: 'https'
          scrape_interval: 60s

        - job_name: 'nginx-exporter'
          static_configs:
            - targets: ['${GATEWAY_URL}:9113']
          scheme: 'https'
          scrape_interval: 60s

      remote_write:
        - url: https://prometheus-blocks.grafana.net/api/prom/push
          basic_auth:
            username: ${GRAFANA_CLOUD_USER_ID}
            password: ${GRAFANA_CLOUD_API_TOKEN}

    logsConfig:
      global:
        clients:
          - url: https://logs-prod-us-central1.grafana.net/loki/api/v1/push
            basic_auth:
              username: ${GRAFANA_CLOUD_USER_ID}
              password: ${GRAFANA_CLOUD_API_TOKEN}
            external_labels:
              cluster: render-production
              service: api-stack
              environment: production
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
type: Opaque
stringData:
  user-id: "YOUR_USER_ID_HERE"
  api-token: "YOUR_API_TOKEN_HERE"
