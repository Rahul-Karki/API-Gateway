version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: api-gateway2
    ports:
      - "8080:8080"
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx/routes:/etc/nginx/routes:ro
    - ./nginx/includes:/etc/nginx/includes:ro
    depends_on:
      - app1
      - auth-service
    networks:
      - gateway-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri=http://gateway:8080/metrics
    depends_on:
      - gateway
    networks:
      - gateway-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/rules:/etc/prometheus/rules
    ports:
      - "9090:9090"
    networks:
      - gateway-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - gateway-net

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml
    command: -config.file=/etc/loki/config.yml
    networks:
      - gateway-net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./observability/loki/promtail-config.yml:/etc/promtail/config.yml
      - /var/log/nginx:/var/log/nginx
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - gateway
    networks:
      - gateway-net


  app1:
    build:
      context: ./services/app1
    container_name: app1
    expose:
      - "3000"
    networks:
      - gateway-net

  auth-service:
    build:
      context: ./services/auth-service
    container_name: authentica-service
    expose:
      - "4000"
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

