server {
    listen 8080;

    include /etc/nginx/includes/health.conf;
    include /etc/nginx/includes/metrics.conf;

    # =========================
    # PRODUCTS ROUTES
    # =========================
    location /api/products/ {

    # ✅ Strip backend CORS
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Expose-Headers';

    # ✅ ALL add_header in one place — never split them
    add_header 'Access-Control-Allow-Origin'      'https://api-gateway-snowy.vercel.app' always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'X-Cache-Status'                   $upstream_cache_status always;

    # ✅ Preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ✅ Rate limiting
    limit_req zone=per_ip burst=5 nodelay;
    limit_req_status 429;
    limit_conn conn_limit 10;

    # ✅ Cache logic
    set $no_cache 0;
    if ($request_uri !~ "^/api/products/all$") {
        set $no_cache 1;
    }

    proxy_cache app_cache;
    proxy_cache_valid 200 30s;
    proxy_cache_methods GET;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_bypass $no_cache $http_pragma;
    proxy_no_cache $no_cache $http_pragma;
    proxy_ignore_headers Cache-Control Expires;

    # ✅ Proxy
    proxy_pass       https://backend-ccf7.onrender.com;
    proxy_set_header Host            backend-ccf7.onrender.com;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization   $http_authorization;
    proxy_set_header Cookie          $http_cookie;
     proxy_pass_header Set-Cookie;

    proxy_ssl_server_name on;
}

    # =========================
    # USERS / AUTH ROUTES
    # =========================
   location /api/auth/ {

    # ✅ Strip CORS from backend to prevent duplicates
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Expose-Headers';

    # ✅ CORS — set once by nginx only
    add_header 'Access-Control-Allow-Origin'      'https://api-gateway-snowy.vercel.app' always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # ✅ Preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ✅ Fix loop — use backend's real host, not nginx's $host
    proxy_pass                      https://backend-ccf7.onrender.com;
    proxy_set_header Host            backend-ccf7.onrender.com;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization   $http_authorization;
    proxy_set_header Cookie          $http_cookie;
     proxy_pass_header Set-Cookie;

    proxy_ssl_server_name on;
}

    # =========================
    # CATCH-ALL /api/ FALLBACK
    # =========================
    location /api/ {

        # ✅ CORS (consistent with all other blocks)
        add_header 'Access-Control-Allow-Origin'      'https://api-gateway-snowy.vercel.app' always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers'    'X-Cache-Status' always;

        # ✅ Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass         https://backend-ccf7.onrender.com;
        proxy_set_header   Host              backend-ccf7.onrender.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header Set-Cookie;

        proxy_ssl_server_name on;
    }

   
}