server {
    listen 8080;

    include /etc/nginx/includes/health.conf;
    include /etc/nginx/includes/metrics.conf;

    # In your nginx config, add:
location = / {
    return 200 "OK\n";
    add_header Content-Type text/plain;
}

location = /favicon.ico {
    return 204;  # No content
    access_log off;
}

    # =========================
    # PRODUCTS ROUTES
    # =========================
    location ^~ /api/products/ {

    # ✅ Strip backend CORS
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Expose-Headers';

    # ✅ ALL add_header in one place — never split them
    add_header 'Access-Control-Allow-Origin'      'https://api-gateway-snowy.vercel.app' always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type' always;
    add_header 'Access-Control-Expose-Headers'    'X-Cache-Status, X-Cache, X-Cache-Policy, X-Backend-Duration, Server-Timing, X-RateLimit-Limit, X-RateLimit-Remaining, Retry-After' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # ✅ Preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ✅ Rate limiting
    limit_req zone=edge_api_per_ip burst=2 nodelay;
    limit_req_status 429;
    limit_conn conn_limit 30;

    # ✅ Proxy
    proxy_pass       https://backend-ccf7.onrender.com;
    proxy_set_header Host            backend-ccf7.onrender.com;
    include /etc/nginx/includes/proxy.conf;

    proxy_set_header Authorization   $http_authorization;
    proxy_set_header Cookie          $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_pass_header X-Cache-Status;
    proxy_pass_header X-Cache;
    proxy_pass_header X-Cache-Policy;
    proxy_pass_header X-Backend-Duration;
    proxy_pass_header Server-Timing;
    proxy_pass_header X-RateLimit-Limit;
    proxy_pass_header X-RateLimit-Remaining;
    proxy_pass_header Retry-After;

    proxy_ssl_server_name on;
}

    # =========================
    # USERS / AUTH ROUTES
    # =========================
   location /api/auth/ {

    # ✅ Strip CORS from backend to prevent duplicates
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Expose-Headers';

    # ✅ CORS — set once by nginx only
    add_header 'Access-Control-Allow-Origin'      'https://api-gateway-snowy.vercel.app' always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # ✅ Preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ✅ Rate limiting
    limit_req zone=edge_auth_per_ip burst=30;
    limit_req_status 429;
    limit_conn conn_limit 30;

    # ✅ Fix loop — use backend's real host, not nginx's $host
    proxy_pass                      https://backend-ccf7.onrender.com;
    proxy_set_header Host            backend-ccf7.onrender.com;
    include /etc/nginx/includes/proxy.conf;
    proxy_set_header Authorization   $http_authorization;
    proxy_set_header Cookie          $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_pass_header X-RateLimit-Limit;
    proxy_pass_header X-RateLimit-Remaining;
    proxy_pass_header Retry-After;

    proxy_ssl_server_name on;
}

    # =========================
    # CATCH-ALL /api/ FALLBACK
    # =========================
    location /api/ {

        # ✅ CORS (consistent with all other blocks)
        add_header 'Access-Control-Allow-Origin'      'https://api-gateway-snowy.vercel.app' always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers'    'X-Cache-Status, X-Cache, X-Cache-Policy, X-Backend-Duration, Server-Timing, X-RateLimit-Limit, X-RateLimit-Remaining, Retry-After' always;

        limit_req zone=edge_api_per_ip burst=2 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 30;

        # ✅ Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass         https://backend-ccf7.onrender.com;
        proxy_set_header   Host              backend-ccf7.onrender.com;
        include /etc/nginx/includes/proxy.conf;
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header Set-Cookie;
        proxy_pass_header X-Cache-Status;
        proxy_pass_header X-Cache;
        proxy_pass_header X-Cache-Policy;
        proxy_pass_header X-Backend-Duration;
        proxy_pass_header Server-Timing;
        proxy_pass_header X-RateLimit-Limit;
        proxy_pass_header X-RateLimit-Remaining;
        proxy_pass_header Retry-After;

        proxy_ssl_server_name on;
    }

   
}