server {
    listen 8080;

    include /etc/nginx/includes/health.conf;
    include /etc/nginx/includes/metrics.conf;

    # =========================
    # PRODUCTS ROUTES
    # =========================
    location /api/products/ {

        # ✅ CORS (for ALL responses)
        add_header 'Access-Control-Allow-Origin' 'https://api-gateway-p6u1.onrender.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'X-Cache-Status' always;

        # ✅ Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        # =========================
        # Rate limiting
        # =========================
        limit_req zone=per_ip burst=5 nodelay;
        limit_req_status 429;

        limit_conn conn_limit 10;

        # =========================
        # Cache logic
        # =========================
        set $no_cache 0;
        if ($request_uri !~ "^/api/products/all$") {
            set $no_cache 1;
        }

        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;

        proxy_cache app_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_methods GET;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        add_header X-Cache-Status $upstream_cache_status always;

        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_bypass $http_pragma;
        proxy_no_cache $http_pragma;

        # =========================
        # Proxy to backend
        # =========================
        proxy_pass http://backend:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================
    # USERS / AUTH ROUTES
    # =========================
    location /api/auth/ {

        # ✅ CORS (same as above)
        add_header 'Access-Control-Allow-Origin' 'https://api-gateway-p6u1.onrender.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # ✅ Preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        # =========================
        # Proxy
        # =========================
        proxy_pass http://backend:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ✅ Important for cookies/auth
        proxy_set_header Cookie $http_cookie;
    }

     # 🔥 THIS BLOCK IS MANDATORY
    location /api/ {

        # ✅ Handle preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin https://api-gateway-p6u1.onrender.com;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Allow-Credentials true;
            return 204;
        }

        # ✅ CORS headers
        add_header Access-Control-Allow-Origin https://api-gateway-p6u1.onrender.com;
        add_header Access-Control-Allow-Credentials true;

    }

    # =========================
    # GLOBAL CONFIGS
    # =========================
    include /etc/nginx/includes/rate-limit.conf;
    include /etc/nginx/includes/auth-jwt.conf;
}