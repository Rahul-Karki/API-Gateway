#
# Edge rate limiting (Nginx)
# Notes:
# - Cold-start/backends waking up can cause multiple near-simultaneous requests.
# - Keep auth stricter, but allow a higher burst on general API so requests queue
#   instead of returning 429 during transient slow backend responses.
#
limit_req_zone $binary_remote_addr zone=edge_api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=edge_auth_per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;