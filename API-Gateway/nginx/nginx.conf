worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/json;

  sendfile on;
  keepalive_timeout 65;

  include /etc/nginx/includes/rate-limit-zones.conf;  

  #Caching 
  include /etc/nginx/includes/caching.conf;


  # Logging 
  include /etc/nginx/includes/logging.conf;


  include /etc/nginx/routes/*.conf;
}
