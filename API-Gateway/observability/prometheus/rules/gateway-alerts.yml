groups:
- name: api-gateway-alerts
  rules:

  - alert: ApiGatewayHigh5xxRate
    expr: |
      sum(rate(nginx_http_requests_total{status=~"5.."}[1m]))
      /
      sum(rate(nginx_http_requests_total[1m]))
      > 0.02
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "High 5xx error rate on API Gateway"
      description: "More than 2% of requests are failing with 5xx errors."

  - alert: ApiGatewayHighLatencyP95
    expr: |
      histogram_quantile(
        0.95,
        sum(rate(nginx_http_request_duration_seconds_bucket[5m])) by (le)
      ) > 1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High P95 latency on API Gateway"
      description: "95th percentile latency is above 1 second."

  - alert: ApiGatewayHighRateLimitHits
    expr: |
      sum(rate(nginx_http_requests_total{status="429"}[1m])) > 5
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "High rate-limit rejections"
      description: "More than 5 requests/sec are being rate-limited."

  - alert: ApiGatewayDown
    expr: up{job="nginx-gateway"} == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "API Gateway is DOWN"
      description: "Prometheus cannot scrape the API Gateway metrics."
